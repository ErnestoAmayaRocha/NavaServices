  <!-- Header component -->

  <!-- GTranslate -->
  <script>
    window.gtranslateSettings = {
      default_language: "en",
      languages: ["en", "es"],
      wrapper_selector: ".gtranslate_wrapper"
    };
  </script>

  <script
    src="https://cdn.gtranslate.net/widgets/latest/dropdown.js"
    defer>

  <style>
    :root {
      --nava-navy: #061A2F;
      --nava-green: #69AD49;
      --nava-yellow: #F5A900;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      color: var(--nava-navy);
      background: #fff;
    }

    /* Contenido principal */
    .nava-main {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    /* Secciones futuras */
    .nava-section {
      width: 100%;
      padding: 80px 24px;
    }

    .nava-section__container {
      width: min(1200px, 100%);
      margin: 0 auto;
    }

    @media (max-width: 760px) {
      .nava-section {
        padding: 56px 18px;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <nava-header></nava-header>

  <!-- Main content -->
  <main class="nava-main">

    <!-- Hero -->
    <nava-hero></nava-hero>

    <!-- Aquí agregaremos Services Overview -->
       <nava-services></nava-services>
    <!-- Aquí agregaremos Why Choose NAVA -->

    <!-- Aquí agregaremos CTA -->
     <nava-cta></nava-cta>

  <!-- Aquí agregaremos el footer reutilizable -->
<nava-footer></nava-footer>
